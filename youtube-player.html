<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RichGuyLos Radio YouTube Player</title>
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://www.google.com" />
    <style>
      html, body, #player { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
      body { position: relative; }
      #starter { position: absolute; inset: 0; z-index: 10; width: 100%; height: 100%; border: 0; background: #000; color: #fff; cursor: pointer; }
      #starter[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="player"></div>
    <button id="starter" type="button">Start YouTube audio</button>
    <script>
      const params = new URLSearchParams(location.search)
      const videoId = params.get('v') || ''
      const starter = document.getElementById('starter')
      let player
      let desiredVolume = 0.8

      starter.addEventListener('click', () => {
        if (!player) return
        player.playVideo()
        starter.hidden = true
        setTimeout(reportState, 200)
      })

      function reportState() {
        if (!player || typeof player.getPlayerState !== 'function') return
        const state = player.getPlayerState()
        const data = player.getVideoData?.() || {}
        window.AC?.send?.('youtube-state', {
          loaded: state !== -1,
          playing: state === 1,
          title: data.title || 'YouTube Music',
          artist: data.author || 'YouTube',
          position: player.getCurrentTime?.() || 0,
          duration: player.getDuration?.() || 0,
          volume: desiredVolume,
        })
      }

      function runCommand(command) {
        if (!player) return false
        const action = command?.action
        if (action === 'play') player.playVideo()
        if (action === 'pause') player.pauseVideo()
        if (action === 'seek') player.seekTo(Number(command.value) || 0, true)
        if (action === 'volume') {
          desiredVolume = Math.max(0, Math.min(1, Number(command.value)))
          // CSP controls the redirected audio event directly. Keep the web source at full level.
          player.setVolume(100)
        }
        if (action === 'stop') player.stopVideo()
        setTimeout(reportState, 100)
        return true
      }

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          width: '640',
          height: '360',
          videoId,
          playerVars: { autoplay: 1, controls: 0, enablejsapi: 1, playsinline: 1, rel: 0, origin: location.origin, widget_referrer: location.origin },
          events: {
            onReady(event) {
              event.target.setVolume(100)
              if (videoId) event.target.playVideo()
              window.AC?.send?.('youtube-ready', { videoId })
              reportState()
            },
            onStateChange(event) {
              if (event.data === 1) starter.hidden = true
              reportState()
            },
            onError(event) { window.AC?.send?.('youtube-error', { code: event.data }) },
          },
        })
        window.AC?.onReceive?.('rgl-command', runCommand)
        setInterval(reportState, 750)
      }
    </script>
    <script src="https://www.youtube.com/iframe_api"></script>
  </body>
</html>
